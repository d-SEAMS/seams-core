[workspace]
name = "seams-core"
version = "2.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
authors = ["Rohit Goswami <rgoswami@ieee.org>"]

[dependencies]
compilers = ">=1.9.0,<2"
eigen = "3.4.0.*"
libblas = ">=3.11.0,<4"
liblapack = ">=3.11.0,<4"
catch2 = ">=3.6.0,<4"
meson = ">=1.3.0"
ninja = ">=1.13.2,<2"
pkgconfig = ">=1.5.5,<2"
python = "3.12.*"
nanobind = ">=2.14"
numpy = ">=1.24"
pip = "*"
meson-python = ">=0.16"
pytest = ">=8.0"
lcov = ">=1.16"
libhwy = ">=1.3.0"
chemfiles = ">=0.10"

[tasks]
setup = "meson setup bbdir --prefix=$CONDA_PREFIX -Dwith_tests=true -Dwith_python=false --wipe 2>/dev/null; meson setup bbdir --prefix=$CONDA_PREFIX -Dwith_tests=true -Dwith_python=false"
build = { cmd = "ninja -j4 -C bbdir", depends-on = ["setup"] }
test = { cmd = "meson test -C bbdir -v", depends-on = ["build"] }
install = { cmd = "meson install -C bbdir", depends-on = ["build"] }
# Python tests live in d-SEAMS/PydSEAMSlib
coverage-setup = "meson setup bbdir-cov --prefix=$CONDA_PREFIX -Dwith_tests=true -Dwith_python=false -Db_coverage=true --wipe 2>/dev/null; meson setup bbdir-cov --prefix=$CONDA_PREFIX -Dwith_tests=true -Dwith_python=false -Db_coverage=true"
coverage-build = { cmd = "ninja -j4 -C bbdir-cov", depends-on = ["coverage-setup"] }
coverage-run = { cmd = """
meson test -C bbdir-cov && ninja -C bbdir-cov coverage && \
lcov --remove bbdir-cov/meson-logs/coverage.info \
  '*/external/backward.hpp' '*/backward.cpp' \
  '*/tests/*' '*/bench_*' \
  --output-file bbdir-cov/meson-logs/coverage.info --ignore-errors unused
""", depends-on = ["coverage-build"] }

[environments]
docs = { features = ["docs"] }
formalanalysis = { features = ["formalanalysis"] }
mpi = { features = ["mpi"] }
ira = { features = ["ira"] }
sphericart = { features = ["sphericart"] }
nauty = { features = ["nauty"] }
repro = { features = ["repro"] }

[feature.ira]
platforms = ["linux-64"]

[feature.ira.dependencies]
ira = ">=2.2"

[feature.sphericart]
platforms = ["linux-64"]

[feature.sphericart.dependencies]
sphericart = ">=0.7"

[feature.nauty]
platforms = ["linux-64"]

[feature.nauty.dependencies]
nauty = ">=2.8"

[feature.mpi]
platforms = ["linux-64"]

[feature.mpi.dependencies]
openmpi = ">=5.0"

[feature.formalanalysis]
platforms = ["linux-64"]

[feature.formalanalysis.dependencies]
python = "3.12.*"
coq = "8.12.2.*"

[feature.formalanalysis.pypi-dependencies]
sympy = ">=1.13"
hypothesis = ">=6.100"
mpmath = ">=1.3"

[feature.formalanalysis.tasks]
verify-sympy = { cmd = "pytest analysis/ -v" }
verify-coq = { cmd = "cd proofs && make" }
verify-all = { depends-on = ["verify-sympy", "verify-coq"] }

[feature.docs]
# doxyrest only works on linux
platforms = ["linux-64"]

[feature.docs.dependencies]
python = "3.12.*"
emacs = ">=30"
graphviz = ">=12"
doxygen = ">=1.13"
doxyrest = ">=2.1"

[feature.docs.pypi-dependencies]
shibuya = ">=2025.12, <2027"
sphinx = ">=8.0, <9"
sphinx-sitemap = ">=2.9, <3"
myst-parser = ">=4.0, <5"

[feature.docs.tasks.setup-doxyrest]
description = "Clones the doxyrest dependency into the subprojects directory"
cmd = "test -d subprojects/doxyrest || (mkdir -p subprojects && git clone --depth 1 --single-branch https://github.com/vovkos/doxyrest subprojects/doxyrest)"

[feature.docs.tasks.patch-doxyrest]
description = "Apply temporary fixes for documentation"
depends-on = ["setup-doxyrest"]
cmd = """
cp scripts/patches/doxyrest/doxyrest.py subprojects/doxyrest/sphinx/doxyrest.py &&
patch -p1 -N -s < scripts/patches/doxyrest/enum_class_fix.patch || true
"""

[feature.docs.tasks.mkrst]
cwd = "docs"
cmd = "emacs --batch --load export.el"

[feature.docs.tasks.doxybuild]
description = "Generates XML via Doxygen and converts it to RST via Doxyrest"
cwd = "docs/source"
depends-on = ["patch-doxyrest"]
cmd = "doxygen Doxyfile_seams.cfg && doxyrest -c doxyrest-config.lua"

[feature.docs.tasks.sphinxbld]
depends-on = ["mkrst", "doxybuild"]
cmd = "sphinx-build -d docs/doctrees docs/source/ docs/build"

[feature.docs.tasks.docbld]
depends-on = ["sphinxbld"]

[feature.docs.tasks.docdel]
cwd = "docs"
# removes files generated by doxygen, sphinx and orgmode
cmd = """
rm -rf build
rm -rf doctrees
rm -rf source/xml
rm -rf source/api
rm -rf source/contributing
rm -rf source/tutorials
rm -rf source/howto
rm -rf source/reference
rm -rf source/*.rst
"""

[feature.repro]
# Reproducibility workflow: Snakemake DAG over the paper benches, literature
# descriptor comparison, and the aggregation into the results manifest
platforms = ["linux-64"]

[feature.repro.dependencies]
freud = ">=3.0"
pyscal3 = ">=3.0"
jupytext = ">=1.16"
ipykernel = ">=6.0"
papermill = ">=2.4"
matplotlib-base = ">=3.8"

[feature.repro.pypi-dependencies]
snakemake = ">=8.0"
