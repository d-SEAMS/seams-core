[workspace]
name = "seams-core"
version = "2.14.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
authors = ["Rohit Goswami <rgoswami@ieee.org>"]

[dependencies]
compilers = ">=1.9.0,<2"
eigen = "3.4.0.*"
# conda-forge BLAS/LAPACK ABI. Meson prefers FlexiBLAS when present.
libblas = ">=3.11.0,<4"
liblapack = ">=3.11.0,<4"
catch2 = ">=3.6.0,<4"
meson = ">=1.3.0"
ninja = ">=1.13.2,<2"
pkgconfig = ">=1.5.5,<2"
python = "3.12.*"
nanobind = ">=2.14"
numpy = ">=1.24"
pip = "*"
# linkcell, readcon and the Rust binding need cargo on PATH.
rust = ">=1.80"
meson-python = ">=0.16"
pytest = ">=8.0"
lcov = ">=1.16"
libhwy = ">=1.3.0"
chemfiles = ">=0.10"
# Ozaki tests link libgmp and libmpfr.
gmp = ">=6.3.0,<7"
mpfr = ">=4.2.2,<5"

[tasks]
setup = "meson setup bbdir --prefix=$CONDA_PREFIX -Dwith_tests=true --wipe 2>/dev/null; meson setup bbdir --prefix=$CONDA_PREFIX -Dwith_tests=true"
build = { cmd = "ninja -j4 -C bbdir", depends-on = ["setup"] }
test = { cmd = "meson test -C bbdir -v", depends-on = ["build"] }
render-molecules = "python docs/scripts/render_molecules.py"
install = { cmd = "meson install -C bbdir", depends-on = ["build"] }
setup-bindings = { cmd = "meson setup bbdir-lang --prefix=$CONDA_PREFIX -Dwith_tests=true -Dwith_python=false -Dwith_cli=true" }
build-bindings = { cmd = "ninja -C bbdir-lang bindings/test_seams_lang", depends-on = ["setup-bindings"] }
test-bindings = { cmd = "meson test -C bbdir-lang seams_lang_fixtures --print-errorlogs", depends-on = ["build-bindings"] }
# Coverage runs the same docs and OpenMM tests as the default build, and
# those import the in-tree extension. Leaving -Dwith_python=false makes
# them fail before any line of the snippet runs.
coverage-setup = "meson setup bbdir-cov --prefix=$CONDA_PREFIX -Dwith_tests=true -Db_coverage=true -Dbuildtype=debugoptimized --wipe 2>/dev/null; meson setup bbdir-cov --prefix=$CONDA_PREFIX -Dwith_tests=true -Db_coverage=true -Dbuildtype=debugoptimized"
coverage-build = { cmd = "ninja -j4 -C bbdir-cov", depends-on = ["coverage-setup"] }
coverage-run = { cmd = """
meson test -C bbdir-cov --num-processes 1 && ninja -C bbdir-cov coverage && \
lcov --remove bbdir-cov/meson-logs/coverage.info \
  '*/external/backward.hpp' '*/backward.cpp' \
  '*/tests/*' '*/bench_*' \
  --output-file bbdir-cov/meson-logs/coverage.info --ignore-errors unused
""", depends-on = ["coverage-build"] }

[environments]
docs = { features = ["docs"] }
formalanalysis = { features = ["formalanalysis"] }
mpi = { features = ["mpi"] }
ira = { features = ["ira"] }
sphericart = { features = ["sphericart"] }
nauty = { features = ["nauty"] }
repro = { features = ["repro"] }
cycles = { features = ["cycles"], no-default-feature = true }
# Renderer for the published stills. bpy stays in the cycles env (Python 3.13).
figures = { features = ["figures"], no-default-feature = true }
# Julia and R do not share the docs solve (pcre2). Documenter and pkgdown
# run from these prefixes, which docbld finds on PATH.
site-julia = { features = ["site-julia"], no-default-feature = true }
site-r = { features = ["site-r"], no-default-feature = true }
crosscheck = { features = ["crosscheck"] }
abi = { features = ["abi"] }

[feature.site-julia]
platforms = ["linux-64"]

[feature.site-julia.dependencies]
julia = ">=1.10,<1.12"
ca-certificates = ">=2025"

[feature.site-r]
platforms = ["linux-64"]

[feature.site-r.dependencies]
r-base = ">=4.4,<4.6"
r-pkgdown = ">=2.1"
r-roxygen2 = ">=7"
r-cpp11 = ">=0.4"
r-rcppeigen = ">=0.3"
r-knitr = ">=1.45"
r-rmarkdown = ">=2.25"
ca-certificates = ">=2025"

[feature.figures]
# chemparseplot, OVITO and ase share this interpreter. Sphinx relaunches
# the stills here. libglvnd supplies EGL so OVITO does not need a host driver.
platforms = ["linux-64"]

[feature.figures.dependencies]
python = "3.12.*"
numpy = ">=1.24"
pillow = ">=10"
matplotlib = ">=3.8"
openmm = ">=8"
libglvnd = ">=1.7"
ase = ">=3.22"
pip = "*"

[feature.figures.pypi-dependencies]
chemparseplot = ">=1.9,<2"
genice2 = ">=2.2"
ovito = ">=3.12,<3.18"

[feature.cycles]
# bpy wheels follow Blender's Python, 3.13 from Blender 5.1. The molecule
# stills run Cycles from this interpreter through MOLECULES_BPY.
platforms = ["linux-64"]

[feature.cycles.dependencies]
python = "3.13.*"

[feature.cycles.pypi-dependencies]
bpy = ">=5.1,<5.4"

[feature.ira]
platforms = ["linux-64"]

[feature.ira.dependencies]
ira = ">=2.2"

[feature.sphericart]
platforms = ["linux-64"]

[feature.sphericart.dependencies]
sphericart = ">=0.7"

[feature.nauty]
platforms = ["linux-64"]

[feature.nauty.dependencies]
nauty = ">=2.8"

[feature.mpi]
platforms = ["linux-64"]

[feature.mpi.dependencies]
openmpi = ">=5.0"

[feature.formalanalysis]
platforms = ["linux-64"]

[feature.formalanalysis.dependencies]
python = "3.12.*"
coq = "8.12.2.*"

[feature.formalanalysis.pypi-dependencies]
sympy = ">=1.13"
hypothesis = ">=6.100"
mpmath = ">=1.3"

[feature.formalanalysis.tasks]
verify-sympy = { cmd = "pytest analysis/ -v" }
verify-coq = { cmd = "cd proofs && make" }
verify-all = { depends-on = ["verify-sympy", "verify-coq"] }

[feature.docs]
# doxyrest only works on linux
platforms = ["linux-64"]

[feature.docs.dependencies]
python = "3.12.*"
emacs = ">=30"
graphviz = ">=12"
doxygen = ">=1.17,<2"
doxyrest = ">=2.1"
# Lua 5.4 build, matching doxyrest. LDoc is installed with luarocks.
luarocks = ">=3.11,<3.13"
ca-certificates = ">=2025"

[feature.docs.pypi-dependencies]
shibuya = ">=2025.12, <2027"
sphinx = ">=8.0, <9"
sphinx-sitemap = ">=2.9, <3"
sphinx-design = ">=0.6, <1"
myst-parser = ">=4.0, <5"
sphinxcontrib-mermaid = ">=1.0, <2"
breathe = ">=4.35"
numpydoc = ">=1.8, <2"
ford = ">=7, <8"

[feature.docs.tasks.setup-doxyrest]
description = "Clones the doxyrest dependency into the subprojects directory"
cmd = "test -d subprojects/doxyrest || (mkdir -p subprojects && git clone --depth 1 --single-branch https://github.com/vovkos/doxyrest subprojects/doxyrest)"

[feature.docs.tasks.patch-doxyrest]
description = "Apply temporary fixes for documentation"
depends-on = ["setup-doxyrest"]
cmd = """
cp scripts/patches/doxyrest/doxyrest.py subprojects/doxyrest/sphinx/doxyrest.py &&
cp scripts/patches/doxyrest/doxyrest-shibuya.css subprojects/doxyrest/sphinx/css/doxyrest-shibuya.css &&
patch -p1 -N -s < scripts/patches/doxyrest/enum_class_fix.patch || true
"""

[feature.docs.tasks.mkrst]
cwd = "docs"
cmd = "emacs --batch --load export.el"

[feature.docs.tasks.doxybuild]
description = "Generates XML via Doxygen and converts it to RST via Doxyrest"
cwd = "docs/source"
depends-on = ["patch-doxyrest"]
cmd = "python3 ../../scripts/doxygen_version_header.py && doxygen Doxyfile_seams.cfg && doxyrest -c doxyrest-config.lua && python3 ../../scripts/doxyrest_targets.py ."

[feature.docs.tasks.sphinxbld]
depends-on = ["mkrst", "doxybuild"]
cmd = "sphinx-build -W --keep-going -j 2 -b html -d docs/doctrees docs/source/ docs/build"

[feature.docs.tasks.fetch-doxyyoda]
description = "Download the doxyYoda 0.2.2 HTML theme"
cwd = "."
cmd = "bash scripts/get_doxyyoda.sh"

[feature.docs.tasks.doxyhtml]
description = "Standalone doxyYoda C++ API HTML"
cwd = "docs/source"
depends-on = ["fetch-doxyyoda"]
cmd = "doxygen Doxyfile_doxyyoda.cfg"

[feature.docs.tasks.install-doxyhtml]
description = "Copy doxyYoda HTML into the Sphinx publish tree"
depends-on = ["sphinxbld", "doxyhtml"]
cmd = "rm -rf docs/build/api-cpp && cp -R docs/doxygen-html/html docs/build/api-cpp"

[feature.docs.tasks.ford]
description = "FORD HTML for the Fortran bindings"
cmd = "ford bindings/fortran/ford.md"

[feature.docs.tasks.setup-ldoc]
description = "Install LDoc into the docs environment"
cmd = "test -x $CONDA_PREFIX/bin/ldoc || luarocks --lua-version 5.4 install --tree $CONDA_PREFIX ldoc"

[feature.docs.tasks.ldoc]
description = "LDoc HTML for the Lua bindings"
cwd = "bindings/lua"
depends-on = ["setup-ldoc"]
cmd = "ldoc ."

[feature.docs.tasks.install-binding-docs]
description = "Copy FORD and LDoc HTML into the Sphinx publish tree"
depends-on = ["sphinxbld", "ford", "ldoc"]
cmd = "rm -rf docs/build/fortran docs/build/lua && cp -R docs/ford docs/build/fortran && cp -R docs/ldoc docs/build/lua"

[feature.docs.tasks.fix-built-links]
description = "Repair generated anchor ids the HTML checker follows"
depends-on = ["sphinxbld", "install-doxyhtml", "install-binding-docs"]
cmd = "python3 docs/fix_built_links.py"

[feature.docs.tasks.docbld]
depends-on = ["fix-built-links"]

[feature.docs.tasks.docdel]
cwd = "docs"
# removes files generated by doxygen, sphinx and orgmode
cmd = """
rm -rf build
rm -rf doctrees
rm -rf doxygen-html
rm -rf ford
rm -rf ldoc
rm -rf source/xml
rm -rf source/api
rm -rf source/contributing
rm -rf source/tutorials
rm -rf source/howto
rm -rf source/reference
rm -rf source/*.rst
"""

[feature.repro]
# Reproducibility workflow: Snakemake DAG over the paper benches, literature
# descriptor comparison, and the aggregation into the results manifest
platforms = ["linux-64"]

[feature.repro.dependencies]
freud = ">=3.0"
pyscal3 = ">=3.0"
jupytext = ">=1.16"
ipykernel = ">=6.0"
papermill = ">=2.4"
matplotlib-base = ">=3.8"
lua = ">=5.4,<5.5"

[feature.repro.pypi-dependencies]
snakemake = ">=8.0"

[feature.crosscheck]
# PyPI freud-analysis and ovito for the C API comparison.
platforms = ["linux-64"]

[feature.crosscheck.pypi-dependencies]
freud-analysis = ">=3.6.1,<4"
ovito = ">=3.12.0,<4"

[feature.abi]
# abidiff for the type-level step of capi_abi. conda-forge builds
# libabigail for linux only.
platforms = ["linux-64"]

[feature.abi.dependencies]
libabigail = "2.9.*"

[target.linux-64.dependencies]
lammps = ">=2024.8.29,<2026"
gromacs = ">=2026.3,<2027"
openmm = ">=8.6.1,<9"
plumed = ">=2.9.2,<3"
packmol = ">=21.2.1,<22"
pyscal3 = ">=4.1.0,<5"
ase = ">=3.29.0,<4"
libegl = ">=1.7.0,<2"
libglvnd = ">=1.7.0,<2"
libopengl = ">=1.7.0,<2"
libgl = ">=1.7.0,<2"
libxkbcommon = ">=1.13.2,<2"
glib = ">=2.88.3,<3"
libvulkan-loader = ">=1.4.357.0,<2"
mesa-lavapipe = ">=26.3.0,<27"
# Language fronts. The conda packages are linux-64; other platforms
# keep the tests that exit 77 when julia or Rscript is absent.
julia = ">=1.10"
r-base = ">=4.4"
r-cpp11 = ">=0.4"
r-rcppeigen = ">=0.3.4"
r-testthat = ">=3.2"
# The Lua video tape loads require("dseams") from LuaJIT.
luajit = ">=2.1"
# The docs Lua tests and the example counts run under PUC Lua 5.4.
lua = ">=5.4,<5.5"

[pypi-dependencies]
freud-analysis = ">=3.6.1,<4"
ovito = ">=3.12.0, <4"
genice2 = ">=2.2.13.3, <3"
solvis-tools = ">=0.1.5, <0.2"
# 23.11 is the draft the changelog was written against. 26.x drops the
# blank line under the version heading and the towncrier check fails.
towncrier = "==23.11.0"
chemparseplot = ">=1.8, <2"
