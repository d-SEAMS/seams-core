[workspace]
name = "seams-core"
version = "2.14.0"
channels = ["conda-forge"]
# linux-64 stays the glibc 2.28 baseline. conda-forge has no
# sysroot_linux-64 2.38; 2.39 is the sysroot at or above 2.38. It is
# listed after linux-64 so a newer runner still installs the baseline
# for every environment except plumed210.
platforms = [
  "linux-64",
  "osx-64",
  "osx-arm64",
  { name = "linux-64-glibc239", platform = "linux-64", glibc = "2.39" },
]
authors = ["Rohit Goswami <rgoswami@ieee.org>"]

[dependencies]
compilers = ">=1.9.0,<2"
eigen = "3.4.0.*"
# conda-forge BLAS/LAPACK ABI. Meson prefers FlexiBLAS when present.
libblas = ">=3.11.0,<4"
liblapack = ">=3.11.0,<4"
catch2 = ">=3.6.0,<4"
meson = ">=1.3.0"
ninja = ">=1.13.2,<2"
pkgconfig = ">=1.5.5,<2"
python = "3.12.*"
numpy = ">=1.24"
pip = "*"
# linkcell and readcon need cargo on PATH.
rust = ">=1.80"
pytest = ">=8.0"
lcov = ">=1.16"
libhwy = ">=1.3.0"
chemfiles = ">=0.10"
# Ozaki tests link libgmp and libmpfr.
gmp = ">=6.3.0,<7"
mpfr = ">=4.2.2,<5"

[tasks]
setup = "meson setup bbdir --prefix=$CONDA_PREFIX -Dwith_tests=true --wipe 2>/dev/null; meson setup bbdir --prefix=$CONDA_PREFIX -Dwith_tests=true"
build = { cmd = "ninja -j4 -C bbdir", depends-on = ["setup"] }
test = { cmd = "meson test -C bbdir -v", depends-on = ["build"] }
render-molecules = "python docs/scripts/render_molecules.py"
install = { cmd = "meson install -C bbdir", depends-on = ["build"] }
setup-bindings = { cmd = "meson setup bbdir-lang --prefix=$CONDA_PREFIX -Dwith_tests=true -Dwith_cli=true" }
build-bindings = { cmd = "ninja -C bbdir-lang bindings/test_seams_lang", depends-on = ["setup-bindings"] }
test-bindings = { cmd = "meson test -C bbdir-lang seams_lang_fixtures --print-errorlogs", depends-on = ["build-bindings"] }
# Coverage runs the same docs and OpenMM tests as the default build.
coverage-setup = """
# GCC 14 emits contradictory JSON coverage records for inlined C++ headers.
# The Ubuntu runner's GCC 13 emits consistent records for the same sources.
export CC=/usr/bin/gcc
export CXX=/usr/bin/g++
export CFLAGS="$CFLAGS -O1 -fno-inline -fprofile-update=atomic -fprofile-abs-path -fprofile-filter-files=../src/.*\\;../bindings/.*\\;../subprojects/vesin/.*\\;../subprojects/minimage/.*\\;../subprojects/readcon-core/.*\\;../subprojects/readcon-db/.*\\;../subprojects/gpulite/.*\\;../subprojects/linkcell/.* -fprofile-exclude-files=.*Catch2.*\\;../tests/.*"
export CXXFLAGS="$CXXFLAGS -O1 -fno-inline -fno-default-inline -fprofile-update=atomic -fprofile-abs-path -fprofile-filter-files=../src/.*\\;../bindings/.*\\;../subprojects/vesin/.*\\;../subprojects/minimage/.*\\;../subprojects/readcon-core/.*\\;../subprojects/readcon-db/.*\\;../subprojects/gpulite/.*\\;../subprojects/linkcell/.* -fprofile-exclude-files=.*Catch2.*\\;../tests/.*"
export CPPFLAGS="$CPPFLAGS -O1"
meson setup bbdir-cov --prefix=$CONDA_PREFIX -Dwith_tests=true -Db_coverage=true -Dbuildtype=debugoptimized --wipe 2>/dev/null
meson setup bbdir-cov --prefix=$CONDA_PREFIX -Dwith_tests=true -Db_coverage=true -Dbuildtype=debugoptimized
"""
coverage-build = { cmd = "ninja -j4 -C bbdir-cov", depends-on = ["coverage-setup"] }
coverage-run = { cmd = """
meson test -C bbdir-cov --num-processes 1 && \
lcov --capture --directory bbdir-cov --branch-coverage \
  --config-file .lcovrc --output-file bbdir-cov/meson-logs/coverage.info && \
lcov --remove bbdir-cov/meson-logs/coverage.info \
  '*/backward.cpp' \
  '*/tests/*' '*/bench_*' \
  --config-file .lcovrc --output-file bbdir-cov/meson-logs/coverage.info \
  --ignore-errors unused && \
genhtml bbdir-cov/meson-logs/coverage.info --branch-coverage \
  --config-file .lcovrc --output-directory bbdir-cov/meson-logs/coveragereport
""", depends-on = ["coverage-build"] }

[environments]
# linux-64-glibc239 is the plumed210 feature's platform. Keeping it off
# the default environment means a glibc 2.39 runner still installs the
# glibc 2.28 baseline unless a job names plumed210.
default = { platforms = ["linux-64", "osx-64", "osx-arm64"] }
docs = { features = ["docs"] }
formalanalysis = { features = ["formalanalysis"] }
mpi = { features = ["mpi"] }
ira = { features = ["ira"] }
sphericart = { features = ["sphericart"] }
nauty = { features = ["nauty"] }
repro = { features = ["repro"] }
cycles = { features = ["cycles"], no-default-feature = true }
# Renderer for the published stills. bpy stays in the cycles env (Python 3.13).
figures = { features = ["figures"], no-default-feature = true }
crosscheck = { features = ["crosscheck"] }
abi = { features = ["abi"] }
# PLUMED 2.10 with the 2.39 sysroot. The default environment keeps
# PLUMED 2.9.2 on the glibc 2.28 baseline.
plumed210 = { features = ["plumed210"], no-default-feature = true }

[feature.plumed210]
platforms = ["linux-64-glibc239"]

[feature.plumed210.dependencies]
compilers = ">=1.9.0,<2"
# conda-forge LAMMPS is built against PLUMED 2.9 only, so this
# environment does not install that package. CI compiles LAMMPS
# against this PLUMED 2.10 and this sysroot.
sysroot_linux-64 = ">=2.39"
cmake = ">=3.28"
meson = ">=1.3.0"
ninja = ">=1.13.2,<2"
pkgconfig = ">=1.5.5,<2"
eigen = "3.4.0.*"
python = "3.12.*"
numpy = ">=1.24"
catch2 = ">=3.6.0,<4"
plumed = ">=2.10,<2.11"
openmm = ">=8.6.1,<9"

[feature.figures]
# chemparseplot, OVITO and ase share this interpreter. Sphinx relaunches
# the stills here. libglvnd supplies EGL so OVITO does not need a host driver.
platforms = ["linux-64"]

[feature.figures.dependencies]
python = "3.12.*"
numpy = ">=1.24"
pillow = ">=10"
matplotlib = ">=3.8"
openmm = ">=8"
libglvnd = ">=1.7"
ase = ">=3.22"
pip = "*"

[feature.figures.pypi-dependencies]
chemparseplot = ">=1.9,<2"
genice2 = ">=2.2"
ovito = ">=3.12,<3.18"

[feature.cycles]
# bpy wheels follow Blender's Python, 3.13 from Blender 5.1. The molecule
# stills run Cycles from this interpreter through MOLECULES_BPY.
platforms = ["linux-64"]

[feature.cycles.dependencies]
python = "3.13.*"

[feature.cycles.pypi-dependencies]
bpy = ">=5.1,<5.4"

[feature.ira]
platforms = ["linux-64"]

[feature.ira.dependencies]
ira = ">=2.2"

[feature.sphericart]
platforms = ["linux-64"]

[feature.sphericart.dependencies]
sphericart = ">=0.7"

[feature.nauty]
platforms = ["linux-64"]

[feature.nauty.dependencies]
nauty = ">=2.8"

[feature.mpi]
platforms = ["linux-64"]

[feature.mpi.dependencies]
openmpi = ">=5.0"

[feature.formalanalysis]
platforms = ["linux-64"]

[feature.formalanalysis.dependencies]
python = "3.12.*"
coq = "8.12.2.*"

[feature.formalanalysis.pypi-dependencies]
sympy = ">=1.13"
hypothesis = ">=6.100"
mpmath = ">=1.3"

[feature.formalanalysis.tasks]
verify-sympy = { cmd = "pytest analysis/ -v" }
verify-coq = { cmd = "cd proofs && make" }
verify-all = { depends-on = ["verify-sympy", "verify-coq"] }

[feature.docs]
# doxyrest only works on linux
platforms = ["linux-64"]

[feature.docs.dependencies]
python = "3.12.*"
emacs = ">=30"
graphviz = ">=12"
doxygen = ">=1.17,<2"
doxyrest = ">=2.1"
ca-certificates = ">=2025"

[feature.docs.pypi-dependencies]
shibuya = ">=2025.12, <2027"
sphinx = ">=8.0, <9"
sphinx-sitemap = ">=2.9, <3"
sphinx-design = ">=0.6, <1"
myst-parser = ">=4.0, <5"
sphinxcontrib-mermaid = ">=1.0, <2"
breathe = ">=4.35"
numpydoc = ">=1.8, <2"

[feature.docs.tasks.setup-doxyrest]
description = "Clones the doxyrest dependency into the subprojects directory"
cmd = "test -d subprojects/doxyrest || (mkdir -p subprojects && git clone --depth 1 --single-branch https://github.com/vovkos/doxyrest subprojects/doxyrest)"

[feature.docs.tasks.patch-doxyrest]
description = "Apply temporary fixes for documentation"
depends-on = ["setup-doxyrest"]
cmd = """
cp scripts/patches/doxyrest/doxyrest.py subprojects/doxyrest/sphinx/doxyrest.py &&
cp scripts/patches/doxyrest/doxyrest-shibuya.css subprojects/doxyrest/sphinx/css/doxyrest-shibuya.css &&
patch -p1 -N -s < scripts/patches/doxyrest/enum_class_fix.patch || true
"""

[feature.docs.tasks.mkrst]
cwd = "docs"
cmd = "emacs --batch --load export.el"

[feature.docs.tasks.doxybuild]
description = "Generates XML via Doxygen and converts it to RST via Doxyrest"
cwd = "docs/source"
depends-on = ["patch-doxyrest"]
cmd = "python3 ../../scripts/doxygen_version_header.py && doxygen Doxyfile_seams.cfg && doxyrest -c doxyrest-config.lua && python3 ../../scripts/doxyrest_targets.py ."

[feature.docs.tasks.sphinxbld]
depends-on = ["mkrst", "doxybuild"]
cmd = "sphinx-build -W --keep-going -j 2 -b html -d docs/doctrees docs/source/ docs/build"

[feature.docs.tasks.fetch-doxyyoda]
description = "Download the doxyYoda 0.2.2 HTML theme"
cwd = "."
cmd = "bash scripts/get_doxyyoda.sh"

[feature.docs.tasks.doxyhtml]
description = "Standalone doxyYoda C++ API HTML"
cwd = "docs/source"
depends-on = ["fetch-doxyyoda"]
cmd = "doxygen Doxyfile_doxyyoda.cfg"

[feature.docs.tasks.install-doxyhtml]
description = "Copy doxyYoda HTML into the Sphinx publish tree"
depends-on = ["sphinxbld", "doxyhtml"]
cmd = "rm -rf docs/build/api-cpp && cp -R docs/doxygen-html/html docs/build/api-cpp"

[feature.docs.tasks.fix-built-links]
description = "Repair generated anchor ids the HTML checker follows"
depends-on = ["sphinxbld", "install-doxyhtml"]
cmd = "python3 docs/fix_built_links.py && python3 docs/finalize_seo.py docs/build"

[feature.docs.tasks.docbld]
depends-on = ["fix-built-links"]

[feature.docs.tasks.docdel]
cwd = "docs"
# removes files generated by doxygen, sphinx and orgmode
cmd = """
rm -rf build
rm -rf doctrees
rm -rf doxygen-html
rm -rf source/xml
rm -rf source/api
rm -rf source/contributing
rm -rf source/tutorials
rm -rf source/howto
rm -rf source/getting-started
rm -rf source/user
rm -rf source/development
rm -rf source/reference
rm -rf source/*.rst
"""

[feature.repro]
# Reproducibility workflow: Snakemake DAG over the paper benches, literature
# descriptor comparison, and the aggregation into the results manifest
platforms = ["linux-64"]

[feature.repro.dependencies]
freud = ">=3.0"
pyscal3 = ">=3.0"
jupytext = ">=1.16"
ipykernel = ">=6.0"
papermill = ">=2.4"
matplotlib-base = ">=3.8"
lua = ">=5.4,<5.5"

[feature.repro.pypi-dependencies]
snakemake = ">=8.0"

[feature.crosscheck]
# PyPI freud-analysis and ovito for the C API comparison.
platforms = ["linux-64"]

[feature.crosscheck.pypi-dependencies]
freud-analysis = ">=3.6.1,<4"
ovito = ">=3.12.0,<4"

[feature.abi]
# abidiff for the type-level step of capi_abi. conda-forge builds
# libabigail for linux only.
platforms = ["linux-64"]

[feature.abi.dependencies]
libabigail = "2.9.*"

[target.linux-64.dependencies]
# coverage-run passes --branch-coverage, which lcov 1.x does not know.
lcov = ">=2.0"
lammps = ">=2024.8.29,<2026"
gromacs = ">=2026.3,<2027"
openmm = ">=8.6.1,<9"
# 2.10 builds of lammps need glibc >= 2.38. The lock is glibc 2.28.
plumed = ">=2.9.2,<2.10"
packmol = ">=21.2.1,<22"
pyscal3 = ">=4.1.0,<5"
ase = ">=3.29.0,<4"
libegl = ">=1.7.0,<2"
libglvnd = ">=1.7.0,<2"
libopengl = ">=1.7.0,<2"
libgl = ">=1.7.0,<2"
libxkbcommon = ">=1.13.2,<2"
glib = ">=2.88.3,<3"
libvulkan-loader = ">=1.4.357.0,<2"
mesa-lavapipe = ">=26.3.0,<27"

[pypi-dependencies]
freud-analysis = ">=3.6.1,<4"
ovito = ">=3.12.0, <4"
genice2 = ">=2.2.13.3, <3"
solvis-tools = ">=0.1.5, <0.2"
# 23.11 is the draft the changelog was written against. 26.x drops the
# blank line under the version heading and the towncrier check fails.
towncrier = "==23.11.0"
chemparseplot = ">=1.8, <2"
