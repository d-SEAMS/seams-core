[workspace]
authors = ["Rohit Goswami <rgoswami@ieee.org>"]
channels = ["conda-forge"]
name = "seams-core"
platforms = ["linux-64"]
version = "1.0.1"

[dependencies]
compilers = ">=1.9.0,<2"
gfortran = ">=14.3.0,<14.4"
catch2 = ">=3.12.0,<4"
yaml-cpp = ">=0.8.0,<0.9"
liblapack = ">=3.11.0,<4"
libblas = ">=3.11.0,<4"
boost-cpp = ">=1.85.0,<2"
cmake = ">=3.5,<4"
meson = ">=1.0"
ninja = ">=1.13.2,<2"
pkgconfig = ">=1.5.5,<2"
luarocks = ">=3.13.0,<4"
fmt = "9.1.0.*"
eigen = "3.4.0.*"
lua = "5.3.*"
pkgconf = ">=2.5.1,<3"

[tasks]

[feature.cmake.tasks.build-cmake]
cmd = """
luarocks install luafilesystem && \
mkdir -p bbdir && cd bbdir && \
cmake -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_EXPORT_COMPILE_COMMANDS=YES \
      -DCMAKE_INSTALL_PREFIX:PATH=$CONDA_PREFIX \
      ../ && \
make -j$(nproc) && \
make install
"""

[feature.cmake.tasks.test-cmake]
depends-on = ["build-cmake"]
cmd = "$CONDA_PREFIX/bin/yodaStruct -c lua_inputs/config.yml"

[feature.meson.tasks.build-lib]
cmd = """
mkdir -p bbdir && \
meson setup bbdir && \
meson compile -C bbdir
"""

[feature.meson.tasks.build-pkg]
cmd = """
mkdir -p bbdir && \
meson setup bbdir -Dwith_lua=True \
      -Dwith_tests=True --prefix $CONDA_PREFIX && \
meson install -C bbdir
"""

[feature.meson.tasks.test-meson]
depends-on = ["build-pkg"]
cmd = """
export LD_LIBRARY_PATH=$CONDA_PREFIX/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH && \
$CONDA_PREFIX/bin/yodaStruct -c lua_inputs/config.yml
"""

[environments]
default = {features = ["cmake", "meson"]}
