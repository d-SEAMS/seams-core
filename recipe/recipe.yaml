schema_version: 1

context:
  version: "2.14.0"

package:
  name: libseams
  version: ${{ version }}

source:
  # The build disables every subproject-backed backend and takes Eigen
  # from conda-forge, so the GitHub tag archive is the whole source.
  url: https://github.com/d-SEAMS/seams-core/archive/refs/tags/v${{ version }}.tar.gz
  sha256: fa3e6d8f75e5a06691bd806334f1a89e0998f729d8145a057dc68794a162a551

build:
  number: 0
  skip:
    - win
  script: build-libseams.sh
requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - meson >=1.3
    - ninja
    - pkg-config
    - python *
  host:
    - eigen >=3.4.0
    - if: linux
      then: libgomp
    - if: osx
      then: llvm-openmp
  run_exports:
    - ${{ pin_subpackage('libseams', upper_bound='x.x') }}
tests:
  - package_contents:
      lib:
        - seams
        - seams_lang
        - yodaLib
      include:
        - seams.h
        - seams_version.h
        - seams/seams_lang.h
      bin:
        - seams
      files:
        - lib/pkgconfig/seams.pc
        - lib/pkgconfig/seams-core.pc
        - lib/cmake/seams/seams-config.cmake
  - files:
      source:
        - docs/examples/quickstart.c
    requirements:
      run:
        - ${{ compiler('c') }}
        - pkg-config
    script:
      - seams --version
      - test "$(pkg-config --modversion seams)" = "${{ version }}"
      - ${CC} ${CFLAGS} docs/examples/quickstart.c $(pkg-config --cflags --libs seams) -lm ${LDFLAGS} -Wl,-rpath,${PREFIX}/lib -o quickstart
      - ./quickstart


about:
  homepage: https://dseams.info
  repository: https://github.com/d-SEAMS/seams-core
  documentation: https://docs.dseams.info
  license: MIT
  license_file: LICENSE
  summary: d-SEAMS structural analysis engine for molecular simulations of water and ice
  description: |
    d-SEAMS (Deferred Structural Elucidation Analysis for Molecular
    Simulations) classifies ice, clathrates and interfaces in molecular
    dynamics trajectories: CHILL+, Steinhardt order parameters, primitive
    rings, cages, and shell symmetry. libseams is the C++ engine, its
    stable C API (seams.h), the libseams_lang C ABI the language bindings
    link, and the seams CLI. The Python binding is the separate
    pydseamslib package from d-SEAMS/PydSEAMSlib.

extra:
  recipe-maintainers:
    - HaoZeke
