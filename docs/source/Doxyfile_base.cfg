# Base Doxygen configuration for d-SEAMS
# Project-specific overrides go in Doxyfile_seams.cfg

# Output
GENERATE_HTML          = NO
GENERATE_LATEX         = NO
GENERATE_XML           = YES
GENERATE_MAN           = NO

# Warnings
QUIET                  = YES
WARNINGS               = YES
WARN_IF_UNDOCUMENTED   = YES
WARN_IF_DOC_ERROR      = YES

# Build
EXTRACT_ALL            = NO
EXTRACT_PRIVATE        = NO
EXTRACT_STATIC         = YES
RECURSIVE              = YES

# Language
OPTIMIZE_OUTPUT_FOR_C  = NO
BUILTIN_STL_SUPPORT    = YES

# Style
JAVADOC_BANNER         = YES
JAVADOC_AUTOBRIEF      = YES
INHERIT_DOCS           = YES
INLINE_SOURCES         = NO
SOURCE_BROWSER         = YES

# Preprocessing
ENABLE_PREPROCESSING   = YES
MACRO_EXPANSION        = YES

# Local Variables:
# mode: conf
# End:
