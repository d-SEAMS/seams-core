# Customized Options
# Make changes here to prevent things from being overwritten when the main file
# is updated

# Defaults
@INCLUDE                = "./Doxyfile_base.cfg"

# XML
GENERATE_XML            = YES
XML_PROGRAMLISTING      = NO
# Sphinx uses lowercase references so..
CASE_SENSE_NAMES        = NO
# Prevents links to template arguments
HIDE_UNDOC_RELATIONS    = YES

# HTML
GENERATE_HTML           = NO
USE_MATHJAX             = NO

# LaTeX
GENERATE_LATEX          = NO

# Project Settings
PROJECT_NAME            = "seams-core"
PROJECT_NUMBER          = "v2.9.2"
PROJECT_BRIEF           = "libyodaLib, the C++ engine of d-SEAMS"

# Doxygen Settings
RECURSIVE              = YES
# Public headers only. tests/ and src/include/external/ stay out.
INPUT                  = "../../src/include/internal"
OUTPUT_DIRECTORY       = "."

# Language additions
OPTIMIZE_OUTPUT_FOR_C  = NO
BUILTIN_STL_SUPPORT    = YES

# Style
JAVADOC_BANNER         = YES
JAVADOC_AUTOBRIEF      = YES
INHERIT_DOCS           = YES
INLINE_SOURCES         = YES
SOURCE_BROWSER         = YES
DISABLE_INDEX          = NO
GENERATE_TREEVIEW      = NO
HAVE_DOT               = YES
DOT_IMAGE_FORMAT       = YES
HTML_DYNAMIC_SECTIONS  = YES
INTERACTIVE_SVG        = YES

# Extract everything
EXTRACT_ALL            = YES
EXTRACT_PRIVATE        = NO
EXTRACT_PRIV_VIRTUAL   = NO
EXTRACT_PACKAGE        = YES
EXTRACT_STATIC         = YES
MACRO_EXPANSION        = YES
ENABLE_PREPROCESSING   = YES

EXCLUDE_PATTERNS      += *.py
EXCLUDE_PATTERNS      += */external/*
EXCLUDE_PATTERNS      += */tests/*

# Local Variables:
# mode: conf
# End:
