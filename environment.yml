# To use:
#
#   $ micromamba create -f environment.yml
#   $ micromamba activate dseams
#
name: dseams
channels:
  - conda-forge
dependencies:
  - compilers
  - gfortran
  - catch2
  - liblapack
  - libblas
  # Meson prefers FlexiBLAS when pkg-config finds it. These two are
  # the conda-forge ABI packages (no FlexiBLAS build on that channel).
  - boost-cpp
  - cmake
  - meson
  - cmake
  - pkgconfig
  # Pinned
  - fmt==9.1.0
  - eigen==3.4.0
