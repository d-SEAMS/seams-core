name: Packages
# Build, test and package the Fortran (fpm), Rust (crates.io) and
# Lua/Fennel (LuaRocks) packages the way a downstream user would.
# Nothing here publishes: cargo publish runs with --dry-run and fpm
# publish only prints its upload data.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SEAMS_PREFIX: ${{ github.workspace }}/../seams-prefix
  LUAROCKS_VERSION: "3.12.2"
  LUAROCKS_SHA256: b0e0c85205841ddd7be485f53d6125766d18a81d226588d2366931e9a1484492

concurrency:
  group: ci_packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  libseams:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ninja-build pkg-config libeigen3-dev
          # 24.04 has no libflexiblas-dev. The script uses the distro
          # package when a later image has it, and builds 3.4.4 otherwise.
          sudo sh scripts/install_flexiblas.sh
          pipx install meson
      - name: Build and install libseams
        run: |
          meson setup build-pkg --buildtype=release --prefix="$SEAMS_PREFIX" --libdir=lib \
            -Dwith_tests=false -Dwith_chemfiles=disabled \
            -Dwith_lammps=disabled -Dwith_gromacs=disabled -Dwith_openmm=disabled \
            -Dwith_plumed=disabled -Dwith_gpulite=disabled
          ninja -C build-pkg
          meson install -C build-pkg
          tar -C "$SEAMS_PREFIX" -czf libseams-prefix.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libseams-prefix
          path: libseams-prefix.tar.gz
          retention-days: 3

