name: Packages
# Build and install libseams the way a downstream package would, and keep
# the install prefix as an artifact. The language packages build against
# an installed libseams in their own repositories. Nothing here publishes.
on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  SEAMS_PREFIX: ${{ github.workspace }}/../seams-prefix

concurrency:
  group: ci_packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  libseams:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ninja-build pkg-config libeigen3-dev
          # 24.04 has no libflexiblas-dev. The script uses the distro
          # package when a later image has it, and builds 3.4.4 otherwise.
          sudo sh scripts/install_flexiblas.sh
          pipx install meson
      - name: Build and install libseams
        run: |
          meson setup build-pkg --buildtype=release --prefix="$SEAMS_PREFIX" --libdir=lib \
            -Dwith_tests=false -Dwith_chemfiles=disabled \
            -Dwith_lammps=disabled -Dwith_gromacs=disabled -Dwith_openmm=disabled \
            -Dwith_plumed=disabled -Dwith_gpulite=disabled
          ninja -C build-pkg
          meson install -C build-pkg
          tar -C "$SEAMS_PREFIX" -czf libseams-prefix.tar.gz .
      # The loader path stays unset: the installed programs and libraries
      # find each other by runpath, as a downstream package uses them.
      - name: Run the installed libseams
        run: |
          version=$(python3 scripts/check_release_version.py --print)
          test "$(env -u LD_LIBRARY_PATH "$SEAMS_PREFIX/bin/seams" --version)" = "seams ${version}"
          export PKG_CONFIG_PATH="$SEAMS_PREFIX/lib/pkgconfig"
          test "$(pkg-config --modversion seams)" = "${version}"
          read -ra seams_flags <<< "$(pkg-config --cflags --libs seams)"
          cc docs/examples/quickstart.c "${seams_flags[@]}" -lm -Wl,-rpath,"$SEAMS_PREFIX/lib" -o "$RUNNER_TEMP/quickstart"
          env -u LD_LIBRARY_PATH "$RUNNER_TEMP/quickstart"
          test "$(pkg-config --modversion seams-lang)" = "${version}"
          read -ra lang_flags <<< "$(pkg-config --cflags --libs seams-lang)"
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror tests/lang_pkgconfig_consumer.c "${lang_flags[@]}" \
            -Wl,-rpath,"$SEAMS_PREFIX/lib" -o "$RUNNER_TEMP/lang-consumer"
          test "$(env -u LD_LIBRARY_PATH LD_BIND_NOW=1 "$RUNNER_TEMP/lang-consumer" "${version}" input/xyz/configuration.xyz)" \
            = "seams-lang ${version} frames 1 atoms 256"
      # A binding developed against a checkout sets PKG_CONFIG_PATH to
      # build-pkg/meson-uninstalled. The same consumer has to link and run
      # from there and from a staged install of this build.
      - name: Link a seams-lang consumer against the build tree and an install
        run: CC=cc python3 tests/check_lang_pkgconfig.py build-pkg .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libseams-prefix
          path: libseams-prefix.tar.gz
          retention-days: 3

