name: Release
# A v* tag that names the meson.build version gets a GitHub release with
# the source archive, a Linux libseams prefix built from that archive
# inside a manylinux_2_28 image, SHA256SUMS, and release notes. Fresh
# Ubuntu 22.04, Ubuntu 24.04, and Rocky Linux 9 containers test the
# Linux archive before it is uploaded. GITHUB_TOKEN is the only
# credential; nothing is published to a package registry.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'd-SEAMS/seams-core'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag names the release version
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/check_release_version.py --tag "$TAG_NAME"
          echo "version=$(python3 scripts/check_release_version.py --print)" >> "$GITHUB_OUTPUT"
      - name: Source archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          git archive --format=tar --prefix="seams-core-${VERSION}/" HEAD | gzip -9n > "dist/seams-core-${VERSION}.tar.gz"
      - name: Linux archive on glibc 2.28
        env:
          OUT_DIR: ${{ github.workspace }}/dist
        run: |
          docker run --rm \
            -e OUT_DIR \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash scripts/build_linux_release.sh
      - name: Checksums
        run: |
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - << 'PY'
          import os, pathlib
          ver = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text()
          start = text.index(f"## [{ver}]")
          nxt = text.find("\n## [", start + 1)
          body = text[start:] if nxt < 0 else text[start:nxt]
          note = (
              "The linux-x86_64 archive is built on glibc 2.28 and needs "
              "glibc 2.28 or newer, including RHEL 8, RHEL 9, and Ubuntu "
              "20.04 or newer. Its pkg-config files keep "
              "`prefix=${pcfiledir}/../..`, the archive includes LICENSE "
              "plus the licenses of the third-party code compiled into the "
              "binaries, and the .con reader is included.\n"
          )
          pathlib.Path("dist/release-notes.md").write_text(
              body.strip() + "\n\n" + note
          )
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  test-tarball:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      - name: Install and run the archive on fresh distributions
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          for image in ubuntu:22.04 ubuntu:24.04 rockylinux:9; do
            printf 'testing %s\n' "$image"
            docker run --rm -i \
              -e VERSION \
              -v "$GITHUB_WORKSPACE/dist:$GITHUB_WORKSPACE/dist:ro" \
              -w "$GITHUB_WORKSPACE" \
              "$image" \
              bash -s < scripts/test_libseams_tarball.sh
          done

  publish:
    needs: [build, test-tarball]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          assets=("dist/seams-core-${VERSION}.tar.gz" "dist/libseams-${VERSION}-linux-x86_64.tar.gz" dist/SHA256SUMS)
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG_NAME" --notes-file dist/release-notes.md
          fi
