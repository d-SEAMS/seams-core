name: Sanitizers
on:
  workflow_dispatch:
  push:
    branches: [main, modernize]
  pull_request:
    branches: [main]

concurrency:
  group: ci_sanitize-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  asan-ubsan:
    runs-on: ubuntu-latest
    env:
      # Same default as scripts/build_lammps_serial.sh. The cache key
      # names it so a tag change cannot reuse another LAMMPS build.
      LAMMPS_TAG: stable_29Aug2024
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: default
          cache-key: pixi-sanitize-suite-
      # The serial LAMMPS run_hook links in this job. The suite builds it
      # when the cache is cold.
      - name: Cache the serial LAMMPS
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .lammps-serial/include
            .lammps-serial/lib
            .lammps-serial/.lammps-tag
          key: lammps-serial-${{ env.LAMMPS_TAG }}-${{ hashFiles('scripts/build_lammps_serial.sh') }}
      # scripts/sanitize_suite.sh is the same configure and the whole meson
      # suite. AddressSanitizer and UndefinedBehaviorSanitizer together.
      # Julia and R cannot host that runtime; the Python front is in the suite.
      # ci/lsan-python.supp is folded in with scripts/lsan.supp. LeakSanitizer
      # keeps a single suppressions= file, so the script merges them.
      - run: pixi run scripts/sanitize_suite.sh
        env:
          LSAN_OPTIONS: suppressions=ci/lsan-python.supp

  tsan-openmp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: default
          cache-key: pixi-sanitize-tsan-
      - name: Nightly Rust for the instrumented linkcell build
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          fi
          # shellcheck disable=SC1091
          . "$HOME/.cargo/env"
          rustup toolchain install nightly --profile minimal --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # scripts/sanitize_thread.sh builds Archer's OpenMP runtime, rebuilds
      # linkcell with -Zsanitizer=thread -Zbuild-std, and runs the five tests.
      # ThreadSanitizer's shadow map does not cover the high-entropy
      # mappings a 32-bit ASLR shift produces. 28 is the width it supports.
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: pixi run bash scripts/sanitize_thread.sh
