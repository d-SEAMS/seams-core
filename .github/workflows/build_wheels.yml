name: Build wheels

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - '.github/workflows/build_wheels.yml'
      - 'pyproject.toml'
      - 'meson.build'
      - 'src/**'
      - 'python/**'
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: uv pip install build && python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            cibw-arch: x86_64
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            cibw-arch: aarch64
          - name: macOS x86_64
            os: macos-13
            cibw-arch: x86_64
          - name: macOS arm64
            os: macos-latest
            cibw-arch: arm64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: uv pip install cibuildwheel

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*musllinux* *i686*"
          CIBW_ARCHS: ${{ matrix.cibw-arch }}
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ENVIRONMENT: >
            MACOSX_DEPLOYMENT_TARGET=11
          CIBW_BEFORE_ALL_LINUX: >
            yum install -y eigen3-devel blas-devel lapack-devel ||
            (apt-get update && apt-get install -y libeigen3-dev libblas-dev liblapack-dev) || true
          CIBW_BEFORE_ALL_MACOS: >
            brew install eigen
          CIBW_BEFORE_BUILD: >
            pip install meson-python meson ninja nanobind numpy
          CIBW_TEST_REQUIRES: pytest numpy
          CIBW_TEST_COMMAND: >
            python -c "import pydseamslib; print(pydseamslib.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.cibw-arch }}
          path: ./wheelhouse/*.whl

  # Upload to PyPI on tag push
  publish:
    name: Publish to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
