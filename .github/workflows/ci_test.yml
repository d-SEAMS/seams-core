name: CI
on:
  push:
    branches: [main, modernize]
  pull_request:
    branches: [main]

concurrency:
  group: ci_test-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Hosted runners advertise MANA devices Open MPI's UCX PML cannot open.
      # PLUMED and the engine tests then abort in MPI_Isend.
      UCX_TLS: tcp,self,sm
      OMPI_MCA_pml: ob1
      OMPI_MCA_btl: ^openib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: default
          cache-key: pixi-default-
      # The conda arm64-apple-darwin20.0.0 toolchain needs the macOS 11 SDK it
      # was built against: the runner's Xcode SDK is too new for the conda
      # ld64, whose TAPI parser then imports nothing from libSystem and every
      # target fails on libc symbols (_ungetc, __DefaultRuneLocale, ...)
      - name: Install the macOS 11.0 SDK for the conda compilers
        if: runner.os == 'macOS'
        run: |
          curl -sLO https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.0.sdk.tar.xz
          sudo tar -xf MacOSX11.0.sdk.tar.xz -C /opt
          echo "SDKROOT=/opt/MacOSX11.0.sdk" >> "$GITHUB_ENV"
          echo "CONDA_BUILD_SYSROOT=/opt/MacOSX11.0.sdk" >> "$GITHUB_ENV"
      # OVITO's Python module loads libEGL.so.1. The pixi env ships libegl,
      # and the Ubuntu runner still needs the system loader names.
      - name: Install EGL for OVITO
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libglvnd0
      - run: pixi run setup
      - run: pixi run build
      - run: pixi run test
      - run: pixi run install

  mpi:
    runs-on: ubuntu-latest
    env:
      # Hosted runners expose MANA devices without usable RDMA queues.
      # UCX still selects that device unless the PML is the TCP BTL.
      UCX_TLS: tcp,self,sm
      OMPI_MCA_pml: ob1
      OMPI_MCA_btl: ^openib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: mpi
          cache-key: pixi-mpi-
      - run: pixi run -e mpi meson setup bbdir-mpi -Dwith_mpi=enabled -Dwith_tests=true
      - run: pixi run -e mpi ninja -C bbdir-mpi
      - run: pixi run -e mpi meson test -C bbdir-mpi --print-errorlogs domain domain_mpi seams_mpi_frames_match_serial

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: default
          cache-key: pixi-default-
          cache-write: false
      - name: Install EGL for OVITO
        run: sudo apt-get update && sudo apt-get install -y libegl1 libglvnd0
      - name: Install pydseamslib
        run: pixi run python -m pip install "pydseamslib @ git+https://github.com/d-SEAMS/PydSEAMSlib@v2.14.0"
      - run: pixi run coverage-setup
      - run: pixi run coverage-build
      - run: pixi run coverage-run
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: bbdir-cov/meson-logs/coverage.info
          fail_ci_if_error: false

  # The linux-64 pixi stack: engines, OVITO, GenIce, packmol, the paper
  # tutorials, and the docs snippets against pydseamslib. A skip fails the job.
  pixi-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          # cycles is the bpy interpreter for the molecule stills.
          environments: default cycles
          cache-key: pixi-suite-
      # The locked OVITO wheel matches the locked PySide6 and Qt; a newer
      # wheel needs a newer Qt and import ovito fails.
      - name: Install Snakemake into the pixi interpreter
        run: pixi run python -m pip install 'snakemake>=8' 'sqq==0.5.8'
      # The docs snippet tests import dseams and pydseams from pydseamslib.
      - name: Install pydseamslib
        run: pixi run python -m pip install "pydseamslib @ git+https://github.com/d-SEAMS/PydSEAMSlib@v2.14.0"
      - name: Install EGL for OVITO
        run: sudo apt-get update && sudo apt-get install -y libegl1 libglvnd0
      - name: Build and run the full suite
        run: pixi run bash scripts/ci_pixi_suite.sh
