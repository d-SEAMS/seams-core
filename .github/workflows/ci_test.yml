name: CI
on:
  push:
    branches: [main, modernize]
  pull_request:
    branches: [main]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: default
      # The conda arm64-apple-darwin20.0.0 toolchain needs the macOS 11 SDK it
      # was built against: the runner's Xcode SDK is too new for the conda
      # ld64, whose TAPI parser then imports nothing from libSystem and every
      # target fails on libc symbols (_ungetc, __DefaultRuneLocale, ...)
      - name: Install the macOS 11.0 SDK for the conda compilers
        if: runner.os == 'macOS'
        run: |
          curl -sLO https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.0.sdk.tar.xz
          sudo tar -xf MacOSX11.0.sdk.tar.xz -C /opt
          echo "SDKROOT=/opt/MacOSX11.0.sdk" >> "$GITHUB_ENV"
          echo "CONDA_BUILD_SYSROOT=/opt/MacOSX11.0.sdk" >> "$GITHUB_ENV"
      - run: pixi run setup
      - run: pixi run build
      - run: pixi run test
      - run: pixi run install

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: default
      - run: pixi run coverage-setup
      - run: pixi run coverage-build
      - run: pixi run coverage-run
      - uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5
        with:
          files: bbdir-cov/meson-logs/coverage.info
          fail_ci_if_error: false
