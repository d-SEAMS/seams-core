name: Docs
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Publish gh-pages only from d-SEAMS/seams-core main. Netlify
# (dseamsdocs) is Git-linked to that branch and serves
# https://docs.dseams.info. The push uses GITHUB_TOKEN. The repository
# default token is contents: read, which is the 403 on
# `git push origin gh-pages`.
permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mermaid syntax
        run: python3 docs/check_mermaid.py
      - name: Sitemap mapper
        run: python3 docs/check_sitemap.py --self-test
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: docs
          cache-key: pixi-docs-
      - name: Python numpydoc and FORD
        # docbld runs ford for the Fortran reference; the docs env does not carry it.
        run: pixi run -e docs python -m pip install numpydoc ford

      - name: C++ and Lua API docs
        run: |
          sudo apt-get update && sudo apt-get install -y doxygen lua-ldoc lua5.2
          doxygen docs/Doxyfile.lang
          ldoc --fatalwarnings -c docs/config.ld bindings/lua/dseams.lua

      - name: Build the library the examples call
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: default
          cache-key: pixi-default-

      - name: Language runtimes
        run: sudo apt-get update && sudo apt-get install -y lua5.4 liblua5.4-dev r-base-core gfortran pandoc devscripts texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-fonts-extra xvfb libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-xkb1 libxkbcommon-x11-0 mesa-vulkan-drivers libgl1-mesa-dri

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - run: pixi run -e default setup
      - run: pixi run -e default ninja -j2 -C bbdir
      - name: Julia project for the snippets
        run: julia --project=bindings/julia/Dseams bindings/julia/Dseams/dev/develop_jll.jl

      - name: Cache the brine frames and the renderer wheels
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            docs/.cache/brine-front-230K
            ~/.cache/pip
          key: docs-xvfb-ovito-${{ runner.os }}-brine-4828e33ecf419c70643b2d466bfa4f283b4138dc

      - name: Headless molecule renderer and OpenMM
        run: pixi run -e default python -m pip install ovito pillow openmm

      - name: Xvfb and software Vulkan
        run: |
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "QT_QPA_PLATFORM=xcb" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"

      - name: Ice Ih, language APIs, and science tutorials
        run: DOCS_CI=1 pixi run -e default meson test -C bbdir docs_core_counts docs_capi_examples docs_capi_symbols docs_binding_docstrings docs_lang_ice docs_science_render_copy docs_science_tutorials docs_engine_walkthrough --print-errorlogs

      - name: In-tree Frame package
        run: |
          pixi run -e default python -m pip install pytest solvis-tools
          dest="${RUNNER_TEMP}/pydseams211"
          pixi run -e default python -m pip install --target "$dest" 'pydseamslib==2.11.1'
          echo "PYDSEAMS211=$dest" >> "$GITHUB_ENV"
          py="$(pixi run -e default python -c 'import sys; print(sys.executable)')"
          echo "PYDSEAMS211_PYTHON=$py" >> "$GITHUB_ENV"

      - name: Frame parity and every documented language snippet
        run: |
          set -euo pipefail
          mapfile -t names < <(pixi run -e default meson test -C bbdir --list | awk -F: '/docs_snippet_/ {print $NF}')
          test "${#names[@]}" -gt 0
          # libseams and the engine SDKs are on the rpath. The loader path stays unset.
          # PYDSEAMS211 is only the parity oracle. Snippets import the in-tree package.
          env -u LD_LIBRARY_PATH pixi run -e default meson test -C bbdir --print-errorlogs --no-rebuild python_frame_parity "${names[@]}"

      - run: pixi run -e docs docbld

      - name: Sitemap
        run: python3 docs/check_sitemap.py

      - name: Lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress
            --include-fragments=full
            --index-files index.html
            --root-dir ${{ github.workspace }}/docs/build
            --remap "https://docs.dseams.info file://${{ github.workspace }}/docs/build"
            --max-retries 2
            --timeout 30
            --max-concurrency 4
            --extensions html
            docs/build
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Link check
        run: pixi run -e docs sphinx-build -W --keep-going -j 2 -b linkcheck -d docs/doctrees docs/source docs/linkcheck

      - name: Julia Documenter
        run: |
          export SEAMS_LANG_LIB="$PWD/bbdir/bindings/libseams_lang.so"
          export SEAMS_LIB="$PWD/bbdir/src/libseams.so"
          export LD_LIBRARY_PATH="$PWD/bbdir/src:$PWD/bbdir/bindings${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          julia --project=bindings/julia/Dseams/docs bindings/julia/Dseams/dev/develop_jll.jl
          julia --project=bindings/julia/Dseams/docs bindings/julia/Dseams/docs/make.jl
          julia --project=bindings/julia/Seams/docs bindings/julia/Seams/docs/make.jl

      - name: R CMD check
        run: |
          export DSEAMS_ROOT="$PWD"
          export SEAMS_INCLUDE="$PWD/bindings/cxx"
          export SEAMS_LIBDIR="$PWD/bbdir/bindings"
          export LD_LIBRARY_PATH="$PWD/bbdir/src:$PWD/bbdir/bindings${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export TEXINPUTS="$PWD/docs/tex//:${TEXINPUTS:-}"
          Rscript -e 'install.packages(c("cpp11","RcppEigen","roxygen2","testthat","knitr","rmarkdown"), repos="https://cloud.r-project.org")'
          R CMD build bindings/r/dseams
          R CMD check --as-cran dseams_*.tar.gz
          log=$(echo dseams.Rcheck/00check.log)
          if grep -E 'Undocumented (code objects|arguments|datasets)' "$log"; then
            echo "R check reported undocumented objects"
            exit 1
          fi

      - name: Python doctest
        run: |
          export SEAMS_LIBDIR="$PWD/bbdir/src"
          export LD_LIBRARY_PATH="$PWD/bbdir/src:$PWD/bbdir/bindings${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          pixi run -e docs sphinx-build -W --keep-going -j 2 -b doctest -d docs/doctrees docs/source docs/doctest

      # Upstream main only. Netlify reads this gh-pages tree and serves
      # docs.dseams.info. A CNAME file in the tree would fight that site.
      # peaceiris still writes .nojekyll.
      - name: Deploy to GitHub Pages
        if: github.repository == 'd-SEAMS/seams-core' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build
