name: Docs
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Publish gh-pages only from d-SEAMS/seams-core main. Netlify
# (dseamsdocs) is Git-linked to that branch and serves
# https://docs.dseams.info. The push uses GITHUB_TOKEN. The repository
# default token is contents: read, which is the 403 on
# `git push origin gh-pages`.
# build-deploy publishes. verify runs the same tutorial and language
# checks and does not hold that publish.
permissions:
  contents: write

concurrency:
  group: ci_docs-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # A still whose digest is not published is rendered on the CPU. Two
    # hours covers a full render; a stuck Cycles or Qt process fails.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: docs default cycles figures
          cache-key: pixi-docs-
      - name: Build libseams and seams
        run: |
          pixi run -e default setup
          pixi run -e default ninja -j2 -C bbdir
      - name: Xvfb and software Vulkan
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 mesa-vulkan-drivers libgl1-mesa-dri
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "QT_QPA_PLATFORM=xcb" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
      - name: Cache the brine frames and the renderer wheels
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            docs/.cache/brine-front-230K
            ~/.cache/pip
          key: docs-xvfb-ovito-${{ runner.os }}-brine-4828e33ecf419c70643b2d466bfa4f283b4138dc
      - name: Headless molecule renderer and OpenMM
        run: pixi run -e default python -m pip install ovito pillow openmm
      # The science and walkthrough pages read docs/source/science/figures
      # and docs/source/walkthrough/figures. These tests draw them. conf.py
      # writes blank stand-ins for any that are missing, and the book
      # would publish those.
      - name: Science and engine figures
        run: DOCS_CI=1 pixi run -e default meson test -C bbdir docs_science_render_copy docs_science_tutorials docs_engine_walkthrough --print-errorlogs
      - name: Install pydseamslib
        run: |
          pixi run -e default sh scripts/install_pydseamslib.sh
          pixi run -e docs sh scripts/install_pydseamslib.sh
      - name: Publish the book
        env:
          DOCS_CI: "1"
          SEAMS: ${{ github.workspace }}/bbdir/seams
          SEAMS_LIBDIR: ${{ github.workspace }}/bbdir/src
          SEAMS_LANGDIR: ${{ github.workspace }}/bbdir/bindings
          MOLECULES_BPY: ${{ github.workspace }}/.pixi/envs/cycles/bin/python
        run: |
          export PATH="${{ github.workspace }}/.pixi/envs/figures/bin:${PATH}"
          pixi run -e docs docbld
      - name: SEO metadata
        run: |
          python3 docs/finalize_seo.py --self-test
          python3 docs/finalize_seo.py docs/build
          python3 docs/check_seo.py --self-test
          python3 docs/check_seo.py docs/build
      - name: Mermaid render
        run: python3 docs/check_mermaid.py
      - name: Lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress
            --include-fragments=full
            --index-files index.html
            --root-dir ${{ github.workspace }}/docs/build
            --remap "https://docs.dseams.info file://${{ github.workspace }}/docs/build"
            --remap "https://github.com/d-SEAMS/seams-core/blob/main file://${{ github.workspace }}"
            --max-retries 5
            --retry-wait-time 10
            --timeout 30
            --max-concurrency 4
            --extensions html
            docs/build
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sitemap mapper
        run: python3 docs/check_sitemap.py --self-test
      - name: Sitemap
        run: python3 docs/check_sitemap.py
      # Upstream main only. Netlify reads this gh-pages tree and serves
      # docs.dseams.info. A CNAME file in the tree would fight that site.
      # peaceiris still writes .nojekyll.
      - name: Deploy to GitHub Pages
        if: github.repository == 'd-SEAMS/seams-core' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build
          keep_files: false
          force_orphan: true

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: docs
          cache-key: pixi-docs-
      - name: Python numpydoc
        run: pixi run -e docs python -m pip install numpydoc

      - name: C++ API docs
        run: |
          sudo apt-get update && sudo apt-get install -y doxygen
          doxygen docs/Doxyfile.lang

      - name: Build the library the examples call
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: default
          cache-key: pixi-default-

      - name: Docs runtimes
        run: sudo apt-get update && sudo apt-get install -y pandoc devscripts texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-fonts-extra xvfb libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 mesa-vulkan-drivers libgl1-mesa-dri

      - run: pixi run -e default setup
      - run: pixi run -e default ninja -j2 -C bbdir
      - name: Cache the brine frames and the renderer wheels
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            docs/.cache/brine-front-230K
            ~/.cache/pip
          key: docs-xvfb-ovito-${{ runner.os }}-brine-4828e33ecf419c70643b2d466bfa4f283b4138dc

      - name: Headless molecule renderer and OpenMM
        run: pixi run -e default python -m pip install ovito pillow openmm

      - name: Xvfb and software Vulkan
        run: |
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "QT_QPA_PLATFORM=xcb" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"

      - name: Ice Ih, the C and C++ APIs, and science tutorials
        run: DOCS_CI=1 pixi run -e default meson test -C bbdir docs_core_counts docs_capi_examples docs_capi_symbols docs_lang_ice docs_science_render_copy docs_science_tutorials docs_engine_walkthrough --print-errorlogs

      # The Python snippets import dseams and pydseams from pydseamslib,
      # built from d-SEAMS/PydSEAMSlib against this checkout of the engine.
      - name: Install pydseamslib
        run: pixi run -e default sh scripts/install_pydseamslib.sh

      - name: Every documented snippet
        run: |
          set -euo pipefail
          mapfile -t names < <(pixi run -e default meson test -C bbdir --list | awk -F: '/docs_snippet_/ {print $NF}')
          test "${#names[@]}" -gt 0
          # libseams and the engine SDKs are on the rpath. The loader path stays unset.
          env -u LD_LIBRARY_PATH pixi run -e default meson test -C bbdir --print-errorlogs --no-rebuild "${names[@]}"

      - name: Export the org book
        run: pixi run -e docs mkrst

      # lychee reads the exported sources and the top-level Markdown, with
      # the same ignore list and retries as the published-site check. A
      # slow publisher host is retried instead of failing the job.
      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --no-progress
            --max-retries 5
            --retry-wait-time 10
            --timeout 30
            --max-concurrency 4
            --accept 200,202,206,429
            --remap "https://github.com/d-SEAMS/seams-core/blob/main file://${{ github.workspace }}"
            --extensions rst,md,org,txt
            --exclude-path docs/source/api
            docs/source README.md CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export the org book for doctest
        run: pixi run -e docs mkrst

      - name: Install pydseamslib for the doctest
        run: pixi run -e docs sh scripts/install_pydseamslib.sh

      - name: Python doctest
        run: |
          export SEAMS_LIBDIR="$PWD/bbdir/src"
          export LD_LIBRARY_PATH="$PWD/bbdir/src:$PWD/bbdir/bindings${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          pixi run -e docs sphinx-build -W --keep-going -j 2 -b doctest -d docs/doctrees docs/source docs/doctest
