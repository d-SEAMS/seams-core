name: Bindings
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci_bindings-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: default
          cache-key: pixi-bindings-cpp-
      - name: Build and test the C++ wrapper
        run: |
          pixi run meson setup bbdir-cpp -Dwith_tests=true -Dwith_cli=false
          pixi run ninja -C bbdir-cpp bindings/test_seams_hpp src/docs_api_hpp
          pixi run meson test -C bbdir-cpp seams_hpp_match docs_api_hpp --print-errorlogs

